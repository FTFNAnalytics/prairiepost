; Per-directory PHP limits for this release (PHP-FPM reads .user.ini from
; the script's directory; every request enters through a root-level script).
; Uploads to /api/ingest-media and the admin are capped at 8 MB by the app,
; which answers anything larger with a JSON 413 naming the limit. PHP's
; defaults (2 MB per uploaded file) would refuse a large multipart upload
; before the app could; nginx's client_max_body_size (10m in
; tools/vps/vhost.template) sits above both.
upload_max_filesize = 10M
post_max_size = 12M
