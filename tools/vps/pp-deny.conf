# Prairie Dispatch shared internal-path protections (nginx).
#
# Installed to /etc/nginx/snippets/prairiepost-deny.conf by
# tools/vps/upgrade-papers.sh, which also injects an `include` of it into
# any EXISTING enabled vhost that predates these rules — updating the
# template used for new sites never protected the sites already serving
# (the Phase 2 fix for that gap). Keep in lockstep with vhost.template,
# router.php and .htaccess.

# Application internals are never served: code, runtime data, server-side
# tools and tests, vendored dependencies, runbooks. cron/ stays reachable
# by design — each script 403s without the cron secret.
location ~ ^/(app|data|tools|tests|vendor|docs)(/|$) { deny all; }
location ~ ^/uploads/.+\.(php|phtml|phar)$  { deny all; }
location ~ ^/(config\.php|config\.example\.php|composer\.json|composer\.lock|router\.php)$ { deny all; }
# Dotfiles (.git above all), except the ACME challenge path.
location ^~ /.well-known/acme-challenge/    { }
location ~ /\.                              { deny all; }
# Database dumps, shell scripts, backups, markdown.
location ~ \.(sqlite[0-9]*|sql|sh|md|bak|dist|lock)$ { deny all; }
