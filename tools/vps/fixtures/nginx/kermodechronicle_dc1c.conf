server {
    server_name kermodechronicle.ca;
    root /var/www/prairiepost-7cb82fb9c20a-shared;
    client_max_body_size 10m;
    include /etc/nginx/snippets/prairiepost-deny.conf;
    index index.php index.html;

    access_log /var/log/nginx/kermodechronicle.access.log;
    error_log  /var/log/nginx/kermodechronicle.error.log;

    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location ~ /\. { deny all; }

    location = /admin { return 301 /admin/; }
    location ^~ /admin/ {
        index index.php;
        try_files $uri $uri/ =404;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        }
    }

    location ^~ /app/  { return 403; }
    location ^~ /data/ { return 403; }
    location = /config.php         { return 403; }
    location = /config.example.php { return 403; }
    location ~* ^/uploads/.*\.(?:php|phtml|phar|php[0-9])$ { return 403; }

    location ~ ^/story/(?<route_slug>[a-z0-9-]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/article.php;
        fastcgi_param QUERY_STRING slug=$route_slug&$query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/desk/(?<route_slug>[a-z0-9-]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/section.php;
        fastcgi_param QUERY_STRING slug=$route_slug&$query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/author/(?<route_slug>[a-z0-9-]+)/?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/author.php;
        fastcgi_param QUERY_STRING slug=$route_slug&$query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/card/(?<route_slug>[a-z0-9-]+)\.png$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/card.php;
        fastcgi_param QUERY_STRING slug=$route_slug;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ ^/newsletter(?<newsletter_path>/.*)?$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/newsletter.php;
        fastcgi_param QUERY_STRING path=$newsletter_path&$query_string;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /search      { rewrite ^ /search.php last; }
    location = /feed        { rewrite ^ /feed.php last; }
    location = /feed/       { rewrite ^ /feed.php last; }
    location = /sitemap.xml { rewrite ^ /sitemap.php last; }
    location = /subscribe   { rewrite ^ /subscribe.php last; }
    location = /ad          { rewrite ^ /ad.php last; }
    location = /corrections { rewrite ^ /corrections.php last; }

    location = /api/ingest {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location = /api/ingest-queue {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-queue.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location = /api/ingest-publish {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-publish.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location = /api/ingest-media {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-media.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location = /api/ingest/lookup {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-lookup.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location = /api/ingest/update {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-update.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location = /api/ingest/stories {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-stories.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }

    location ~ ^/api/ingest/drafts/[^/]+/?$ {

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root/ingest-drafts.php;

        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

    }


    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~* \.(?:css|js)$ { expires 7d; access_log off; }
    location ~* \.(?:svg|png|jpe?g|gif|webp|ico|woff2?|ttf)$ { expires 30d; access_log off; }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/kermodechronicle.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kermodechronicle.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kermodechronicle.ca;
    ssl_certificate /etc/letsencrypt/live/kermodechronicle.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kermodechronicle.ca/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://kermodechronicle.ca$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kermodechronicle.ca www.kermodechronicle.ca;
    root /var/www/letsencrypt;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://kermodechronicle.ca$request_uri; }
}
