# portagepress.ca — generated from tools/vps/vhost.template. Do not hand-edit
# route rules into this block: nginx is a front controller here, and routes
# live in router.php alone. Certbot appends the TLS lines after generation.
server {
    server_name portagepress.ca www.portagepress.ca;

    root /var/www/prairiepost-7cb82fb9c20a-shared;
    client_max_body_size 10m;
    index index.php;

    # Application internals are never served: code, runtime data, server-
    # side tools and tests, vendored dependencies, runbooks. cron/ stays
    # reachable by design — each script 403s without the cron secret.
    location ~ ^/(app|data|tools|tests|vendor|docs)(/|$) { deny all; }
    location ~ ^/uploads/.+\.(php|phtml|phar)$  { deny all; }
    location ~ ^/(config\.php|config\.example\.php|composer\.json|composer\.lock|router\.php)$ { deny all; }
    # Dotfiles (.git above all), except the ACME challenge path.
    location ^~ /.well-known/acme-challenge/    { }
    location ~ /\.                              { deny all; }
    # Database dumps, shell scripts, backups, markdown.
    location ~ \.(sqlite[0-9]*|sql|sh|md|bak|dist|lock)$ { deny all; }

    # The front controller: static files first, everything else through the
    # router. `internal` keeps router.php unreachable directly from outside —
    # only the try_files internal redirect may enter it.
    location / {
        try_files $uri /router.php$is_args$args;
    }
    location = /router.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portagepress.ca/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portagepress.ca/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.portagepress.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = portagepress.ca) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name portagepress.ca www.portagepress.ca;
    return 404; # managed by Certbot




}