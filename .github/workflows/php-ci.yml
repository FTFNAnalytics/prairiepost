name: PHP CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-sqlite3 php-mbstring
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './data/*' -print0 | xargs -0 -n1 php -l
      - name: Run regression suite
        run: php tests/run.php
