name: PHP CI

# Pull requests are the gate. The push trigger covers what a pull request
# cannot: commits that reach the release line directly, and the merged
# result itself. Before it existed nothing ever ran on the release head.
on:
  pull_request:
  push:
    branches:
      - main
      - claude/master-dashboard-control-room-nr3mp4

# The workflow only reads the repository. Event metadata (the PR title
# above all) is attacker-influenced: it reaches shell steps ONLY through
# environment variables and is never interpolated into script source.
permissions:
  contents: read

jobs:
  # The full suite on PostgreSQL — the engine production actually runs
  # (the shared Supabase database). sqlite remains the dev/test default;
  # every DB-backed test asserts its actual PDO driver and server
  # version, so a mislabeled run cannot pass. The legacy mysql driver is
  # not a CI gate; its suites remain runnable on demand via
  # PP_TEST_DB=mysql.
  test-postgres:
    # Pinned to the release the production host runs, so the distribution's
    # php-cli is production's PHP 8.3. `ubuntu-latest` had moved on to 26.04
    # and a newer PHP; the step below fails if this ever drifts again.
    runs-on: ubuntu-24.04
    env:
      # The major of the service image below — change the two together.
      # The client tools are pinned to it and the job asserts all three.
      PG_MAJOR: '16'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pptest
          POSTGRES_PASSWORD: pptest
          POSTGRES_DB: pp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pptest" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # tools/backup.sh and tools/restore-drill.sh shell out to pg_dump,
      # psql and pg_restore, and those must be the SERVER's major. The
      # distro's own postgresql-client floats with ubuntu-latest (18 on
      # Ubuntu 26.04), and a pg_restore newer than its target opens with a
      # SET the older server rejects ("unrecognized configuration parameter
      # transaction_timeout") — which the drill rightly counts as a failed
      # restore. So the client comes from the PostgreSQL project's apt
      # repository at the service's major — enabled by the script and
      # signing key Ubuntu's own postgresql-common packages ship — and
      # goes first on PATH for the steps that follow.
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-sqlite3 php-pgsql php-mbstring php-xml php-curl php-gd postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --yes "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
      - name: PHP is production's 8.3
        run: |
          php -v | head -1
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);' \
            || { echo "::error::this job must run the PHP that production runs (8.3)"; exit 1; }
      # No credential here on purpose: a PGPASSWORD in this job's
      # environment would authenticate the drill's psql and pg_restore by
      # itself and leave its passfile contract unproven.
      - name: Client tools are the server's major
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          check() { # label, version line
            echo "$1: $2"
            case "$2" in
              *"(PostgreSQL) $PG_MAJOR."*) ;;
              *) echo "::error::$1 is not PostgreSQL $PG_MAJOR"; exit 1 ;;
            esac
          }
          check server "$(docker exec "$PG_CONTAINER" postgres --version)"
          for tool in pg_dump pg_restore psql; do
            check "$tool" "$("$tool" --version)"
          done
      - name: Run the suite on PostgreSQL
        env:
          PP_TEST_DB: pgsql
          PP_TEST_PG_HOST: 127.0.0.1
          PP_TEST_PG_PORT: '5432'
          PP_TEST_PG_DB: pp_test
          PP_TEST_PG_USER: pptest
          PP_TEST_PG_PASS: pptest
        run: php tests/run.php

  test:
    # Same pin, same reason, as test-postgres above.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli php-sqlite3 php-mbstring php-xml php-curl php-gd
      - name: PHP is production's 8.3
        run: |
          php -v | head -1
          php -r 'exit(PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION === 3 ? 0 : 1);' \
            || { echo "::error::this job must run the PHP that production runs (8.3)"; exit 1; }
      - name: Lint PHP
        run: find . -type f -name '*.php' -not -path './data/*' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      # supabase/schema.sql is generated from app/db.php. The generator's
      # own header says this check belongs in CI; until now nothing ran it,
      # and the copy has drifted from the code before.
      - name: Generated schema matches the code
        run: php tools/schema-sql.php --check
      - name: Validate brand palettes
        run: |
          for f in assets/sites/*/palette.json; do
            php -r 'exit(json_decode(file_get_contents($argv[1]), true) === null ? 1 : 0);' "$f" \
              || { echo "invalid JSON: $f"; exit 1; }
          done
      - name: Run regression suite
        run: php tests/run.php
      - name: Seed the full network — zero skipped lines
        run: bash tools/seed-all.sh /tmp/ci-network.sqlite
      # The baseline compares a pull request with its base, and its gate
      # reads the pull request title, so it has nothing to compare on a push.
      - name: Render baseline against the base branch
        if: github.event_name == 'pull_request'
        env:
          # Event metadata stays data: quoted env expansion only, and the
          # title is read exclusively by render-gate.sh's case match.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF"
          set +e
          PP_BASELINE_OUT=/tmp/baseline-artifacts bash tools/baseline.sh "origin/$BASE_REF"
          rc=$?
          set -e
          bash tools/render-gate.sh "$rc"
      - name: Keep the render diff for reviewers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-baseline
          path: /tmp/baseline-artifacts
          if-no-files-found: ignore
          retention-days: 14
