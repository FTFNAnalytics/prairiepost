<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The maternal pen on the ridge above the Sukunka">
  <defs>
    <linearGradient id="pen-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28455C"/>
      <stop offset="1" stop-color="#9FB6BD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pen-sky)"/>
  <!-- ridge lines -->
  <polygon points="0,190 180,90 360,180 560,80 800,180 800,260 0,260" fill="#1E3D50"/>
  <polygon points="150,110 180,90 214,114 186,126" fill="#C9D8DC" opacity="0.8"/>
  <polygon points="528,100 560,80 596,106 566,118" fill="#C9D8DC" opacity="0.8"/>
  <!-- alpine meadow -->
  <rect y="240" width="800" height="210" fill="#2F5B45"/>
  <polygon points="0,240 800,240 800,270 0,258" fill="#3F7A66"/>
  <!-- scattered subalpine firs -->
  <g fill="#143A2E">
    <polygon points="60,290 76,240 92,290"/><polygon points="110,300 124,258 138,300"/>
    <polygon points="700,286 716,238 732,286"/><polygon points="748,296 762,254 776,296"/>
  </g>
  <!-- the pen fence -->
  <g stroke="#5A4632" stroke-width="4" fill="none">
    <polyline points="200,320 300,290 470,286 600,306 640,340"/>
    <line x1="200" y1="320" x2="200" y2="352"/><line x1="300" y1="290" x2="300" y2="322"/>
    <line x1="390" y1="287" x2="390" y2="318"/><line x1="470" y1="286" x2="470" y2="318"/>
    <line x1="540" y1="294" x2="540" y2="326"/><line x1="600" y1="306" x2="600" y2="338"/>
  </g>
  <g stroke="#7A6A52" stroke-width="2" opacity="0.8">
    <polyline points="200,334 300,304 470,300 600,320"/>
  </g>
  <!-- caribou cow and calf -->
  <g fill="#6B5B48">
    <ellipse cx="380" cy="346" rx="34" ry="17"/>
    <rect x="352" y="346" width="7" height="26"/>
    <rect x="398" y="346" width="7" height="26"/>
    <rect x="404" y="322" width="9" height="20" transform="rotate(18 404 322)"/>
    <circle cx="418" cy="316" r="9"/>
  </g>
  <g stroke="#4A3E30" stroke-width="3" fill="none">
    <path d="M 414 308 q -6 -14 4 -20"/>
    <path d="M 422 308 q 8 -12 2 -20"/>
  </g>
  <g fill="#8A7A62">
    <ellipse cx="450" cy="356" rx="18" ry="10"/>
    <rect x="436" y="356" width="5" height="16"/>
    <rect x="460" y="356" width="5" height="16"/>
    <circle cx="468" cy="342" r="6"/>
  </g>
  <!-- feed shelter -->
  <g>
    <rect x="240" y="300" width="34" height="22" fill="#3A2E22"/>
    <polygon points="234,300 257,286 280,300" fill="#5A4632"/>
  </g>
</svg>
