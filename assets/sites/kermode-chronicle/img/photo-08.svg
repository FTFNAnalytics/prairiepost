<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pulled orchard rows above Summerland, cherries going in behind">
  <defs>
    <linearGradient id="ok-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6B7A"/>
      <stop offset="0.7" stop-color="#C9A96A"/>
      <stop offset="1" stop-color="#E8DFC8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ok-sky)"/>
  <circle cx="640" cy="120" r="36" fill="#F3EFC2" opacity="0.9"/>
  <!-- lake and far bench -->
  <rect y="200" width="800" height="40" fill="#1E5C6E"/>
  <polygon points="0,200 240,164 520,200 800,176 800,200 0,200" fill="#7A5A2E" opacity="0.7"/>
  <!-- benches -->
  <rect y="240" width="800" height="210" fill="#8A6E3B"/>
  <polygon points="0,240 800,240 800,268 0,256" fill="#A88A4A"/>
  <!-- standing orchard rows (left) -->
  <g fill="#2F6B4B">
    <circle cx="80" cy="300" r="20"/><circle cx="80" cy="352" r="22"/><circle cx="80" cy="408" r="24"/>
    <circle cx="150" cy="306" r="20"/><circle cx="150" cy="358" r="22"/><circle cx="150" cy="412" r="24"/>
  </g>
  <g stroke="#4A3E30" stroke-width="4">
    <line x1="80" y1="310" x2="80" y2="330"/><line x1="80" y1="366" x2="80" y2="386"/>
    <line x1="150" y1="316" x2="150" y2="336"/><line x1="150" y1="372" x2="150" y2="392"/>
  </g>
  <g fill="#B03A2E">
    <circle cx="72" cy="296" r="3"/><circle cx="88" cy="304" r="3"/><circle cx="144" cy="352" r="3"/>
    <circle cx="158" cy="360" r="3"/><circle cx="76" cy="356" r="3"/>
  </g>
  <!-- pulled rows: bare soil, stump piles -->
  <g>
    <path d="M 230 268 L 300 450 L 360 450 L 276 268 Z" fill="#6B5B48"/>
    <path d="M 320 268 L 400 450 L 460 450 L 366 268 Z" fill="#6B5B48"/>
    <g stroke="#5A4632" stroke-width="4" opacity="0.9">
      <line x1="250" y1="300" x2="266" y2="292"/><line x1="270" y1="340" x2="288" y2="330"/>
      <line x1="300" y1="390" x2="318" y2="380"/><line x1="344" y1="310" x2="360" y2="300"/>
      <line x1="374" y1="360" x2="392" y2="350"/>
    </g>
  </g>
  <!-- excavator -->
  <g>
    <rect x="470" y="330" width="70" height="30" rx="5" fill="#C9A94A"/>
    <rect x="486" y="308" width="30" height="24" rx="4" fill="#8A6E1C"/>
    <rect x="462" y="360" width="86" height="14" rx="7" fill="#131E28"/>
    <path d="M 540 336 q 40 -30 66 -8" stroke="#8A6E1C" stroke-width="8" fill="none"/>
    <path d="M 606 328 l 16 22 l -20 4 Z" fill="#8A6E1C"/>
  </g>
  <!-- new cherry whips going in (right) -->
  <g stroke="#4A3E30" stroke-width="3">
    <line x1="640" y1="420" x2="640" y2="380"/><line x1="690" y1="412" x2="690" y2="374"/>
    <line x1="740" y1="420" x2="740" y2="382"/>
  </g>
  <g fill="#3F7A66">
    <circle cx="640" cy="374" r="9"/><circle cx="690" cy="368" r="9"/><circle cx="740" cy="376" r="9"/>
  </g>
  <g stroke="#E8DFC8" stroke-width="2">
    <line x1="646" y1="420" x2="646" y2="388"/><line x1="696" y1="412" x2="696" y2="382"/>
  </g>
</svg>
