<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The berth at Swartz Bay, shore power going in">
  <defs>
    <linearGradient id="fy-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A6B7A"/>
      <stop offset="1" stop-color="#9FB6BD"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#fy-sky)"/>
  <!-- gulf islands -->
  <polygon points="0,200 120,170 260,198 800,198 800,214 0,214" fill="#1E3D50" opacity="0.8"/>
  <g fill="#143A2E" opacity="0.85">
    <polygon points="60,198 80,176 100,198"/><polygon points="120,198 142,172 164,198"/>
  </g>
  <!-- water -->
  <rect y="214" width="800" height="236" fill="#1E5C6E"/>
  <g stroke="#A9D0B3" stroke-width="2" fill="none" opacity="0.35">
    <path d="M 40 260 q 90 -8 180 0"/><path d="M 480 250 q 90 -8 180 0"/>
    <path d="M 200 300 q 100 -8 200 0"/>
  </g>
  <!-- ferry -->
  <g>
    <path d="M 150 330 L 172 290 L 520 290 L 542 330 Z" fill="#FDFDFB"/>
    <rect x="184" y="262" width="324" height="28" fill="#FDFDFB"/>
    <rect x="184" y="262" width="324" height="8" fill="#0E2233"/>
    <g fill="#1E3D50">
      <rect x="200" y="276" width="18" height="10"/><rect x="228" y="276" width="18" height="10"/>
      <rect x="256" y="276" width="18" height="10"/><rect x="284" y="276" width="18" height="10"/>
      <rect x="312" y="276" width="18" height="10"/><rect x="340" y="276" width="18" height="10"/>
      <rect x="368" y="276" width="18" height="10"/><rect x="396" y="276" width="18" height="10"/>
      <rect x="424" y="276" width="18" height="10"/><rect x="452" y="276" width="18" height="10"/>
    </g>
    <rect x="236" y="238" width="220" height="24" rx="4" fill="#E8EDEA"/>
    <rect x="330" y="218" width="30" height="20" fill="#0E2233"/>
    <rect x="330" y="214" width="30" height="6" fill="#B03A2E"/>
  </g>
  <!-- dock and charging gantry -->
  <rect x="560" y="308" width="240" height="16" fill="#2C3A44"/>
  <g stroke="#2C3A44" stroke-width="6">
    <line x1="590" y1="324" x2="590" y2="366"/><line x1="680" y1="324" x2="680" y2="366"/>
    <line x1="760" y1="324" x2="760" y2="366"/>
  </g>
  <g>
    <rect x="600" y="230" width="16" height="78" fill="#3D4750"/>
    <rect x="574" y="218" width="68" height="18" rx="4" fill="#3D4750"/>
    <path d="M 574 236 q -24 16 -34 44" stroke="#131E28" stroke-width="6" fill="none"/>
    <circle cx="608" cy="212" r="5" fill="#A9D0B3"/>
  </g>
  <!-- transformer cabinet -->
  <rect x="700" y="278" width="52" height="30" rx="3" fill="#3D4750"/>
  <circle cx="712" cy="288" r="3" fill="#A9D0B3"/>
  <!-- gulls -->
  <g stroke="#FDFDFB" stroke-width="3" fill="none" opacity="0.9">
    <path d="M 90 120 q 8 -8 16 0 q 8 -8 16 0"/>
    <path d="M 640 100 q 7 -7 14 0 q 7 -7 14 0"/>
  </g>
</svg>
