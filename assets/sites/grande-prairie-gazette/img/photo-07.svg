<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="FireSmart crews limbing spruce along the creek corridor">
  <defs>
    <linearGradient id="fs-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A2C7A"/>
      <stop offset="0.6" stop-color="#9A8FC0"/>
      <stop offset="1" stop-color="#C4B8E0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#fs-sky)"/>
  <!-- valley rim -->
  <rect y="200" width="800" height="26" fill="#1A6B5A" opacity="0.5"/>
  <!-- back spruce, dense -->
  <g fill="#0F5C4C">
    <polygon points="20,226 52,120 84,226"/><polygon points="70,226 100,140 130,226"/>
    <polygon points="120,226 152,110 184,226"/><polygon points="176,226 204,150 232,226"/>
    <polygon points="560,226 592,116 624,226"/><polygon points="616,226 646,146 676,226"/>
    <polygon points="668,226 700,120 732,226"/><polygon points="724,226 752,156 780,226"/>
  </g>
  <!-- limbed spruce: bare trunks to head height -->
  <g>
    <line x1="300" y1="226" x2="300" y2="150" stroke="#5A4632" stroke-width="8"/>
    <polygon points="270,168 300,96 330,168" fill="#1A6B5A"/>
    <line x1="380" y1="226" x2="380" y2="140" stroke="#5A4632" stroke-width="8"/>
    <polygon points="348,160 380,84 412,160" fill="#1A6B5A"/>
    <line x1="470" y1="226" x2="470" y2="152" stroke="#5A4632" stroke-width="8"/>
    <polygon points="440,170 470,100 500,170" fill="#1A6B5A"/>
  </g>
  <!-- ground -->
  <rect y="226" width="800" height="224" fill="#274D33"/>
  <!-- creek glimpse -->
  <path d="M 0 400 q 200 -16 400 -2 q 220 14 400 -6 l 0 56 l -800 0 Z" fill="#1E3A6E"/>
  <!-- brush piles -->
  <g fill="#5A4632">
    <path d="M 120 320 q 30 -28 60 0 q 18 16 -8 22 l -50 0 q -20 -8 -2 -22"/>
    <path d="M 620 300 q 26 -24 52 0 q 16 14 -6 20 l -44 0 q -18 -8 -2 -20"/>
  </g>
  <g stroke="#5A4632" stroke-width="4" opacity="0.8">
    <line x1="130" y1="318" x2="176" y2="330"/><line x1="146" y1="334" x2="112" y2="322"/>
    <line x1="630" y1="298" x2="668" y2="310"/>
  </g>
  <!-- crew, hi-vis -->
  <g>
    <circle cx="330" cy="272" r="9" fill="#F2C230"/>
    <rect x="320" y="280" width="20" height="34" rx="6" fill="#E86A10"/>
    <line x1="340" y1="292" x2="368" y2="284" stroke="#2C2C2C" stroke-width="5"/>
    <circle cx="470" cy="284" r="9" fill="#F2C230"/>
    <rect x="460" y="292" width="20" height="34" rx="6" fill="#E86A10"/>
    <circle cx="540" cy="300" r="8" fill="#F2C230"/>
    <rect x="531" y="307" width="18" height="30" rx="6" fill="#E86A10"/>
  </g>
  <!-- skidder -->
  <g>
    <rect x="180" y="264" width="64" height="30" rx="5" fill="#B08F23"/>
    <rect x="196" y="246" width="28" height="20" rx="4" fill="#8A6E1C"/>
    <circle cx="196" cy="298" r="13" fill="#120823"/>
    <circle cx="232" cy="298" r="13" fill="#120823"/>
  </g>
</svg>
