<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Pancake breakfast at the hall, griddle going">
  <rect width="800" height="450" fill="#2D1B4E"/>
  <!-- hall wall + window showing dawn -->
  <rect width="800" height="280" fill="#3A2560"/>
  <g>
    <rect x="80" y="60" width="130" height="120" fill="#9A8FC0"/>
    <rect x="80" y="60" width="130" height="50" fill="#C4A9E8"/>
    <line x1="145" y1="60" x2="145" y2="180" stroke="#2D1B4E" stroke-width="6"/>
    <line x1="80" y1="110" x2="210" y2="110" stroke="#2D1B4E" stroke-width="6"/>
  </g>
  <g>
    <rect x="590" y="60" width="130" height="120" fill="#9A8FC0"/>
    <rect x="590" y="60" width="130" height="50" fill="#C4A9E8"/>
    <line x1="655" y1="60" x2="655" y2="180" stroke="#2D1B4E" stroke-width="6"/>
    <line x1="590" y1="110" x2="720" y2="110" stroke="#2D1B4E" stroke-width="6"/>
  </g>
  <!-- bunting -->
  <g>
    <path d="M 210 40 Q 400 90 590 40" stroke="#5FD3A6" stroke-width="3" fill="none"/>
    <g fill="#17A87A"><polygon points="270,56 284,56 277,76"/><polygon points="380,66 394,66 387,86"/><polygon points="500,60 514,60 507,80"/></g>
    <g fill="#9A8FC0"><polygon points="324,62 338,62 331,82"/><polygon points="440,66 454,66 447,86"/></g>
  </g>
  <!-- cooks -->
  <g>
    <circle cx="330" cy="180" r="12" fill="#EAE6F5"/>
    <rect x="316" y="192" width="28" height="46" rx="8" fill="#0F5C4C"/>
    <circle cx="470" cy="184" r="12" fill="#EAE6F5"/>
    <rect x="456" y="196" width="28" height="42" rx="8" fill="#0F5C4C"/>
    <line x1="344" y1="212" x2="372" y2="228" stroke="#EAE6F5" stroke-width="5"/>
  </g>
  <!-- griddle table -->
  <rect x="240" y="238" width="320" height="18" fill="#1A0E33"/>
  <rect x="256" y="226" width="288" height="14" rx="4" fill="#120823"/>
  <!-- pancakes on griddle -->
  <g fill="#D8B93C">
    <ellipse cx="300" cy="233" rx="20" ry="6"/><ellipse cx="356" cy="233" rx="20" ry="6"/>
    <ellipse cx="412" cy="233" rx="20" ry="6"/><ellipse cx="468" cy="233" rx="20" ry="6"/>
  </g>
  <!-- steam -->
  <g stroke="#C4B8E0" stroke-width="3" fill="none" opacity="0.6">
    <path d="M 300 220 q 4 -10 -2 -18"/><path d="M 412 220 q 4 -10 -2 -18"/><path d="M 468 222 q 4 -10 -2 -18"/>
  </g>
  <!-- floor -->
  <rect y="256" width="800" height="194" fill="#1A0E33"/>
  <!-- long tables with eaters -->
  <g>
    <rect x="60" y="330" width="290" height="14" fill="#5A4632"/>
    <rect x="450" y="330" width="290" height="14" fill="#5A4632"/>
    <g fill="#9A8FC0">
      <circle cx="110" cy="312" r="11"/><circle cx="170" cy="312" r="11"/><circle cx="230" cy="312" r="11"/><circle cx="300" cy="312" r="11"/>
      <circle cx="500" cy="312" r="11"/><circle cx="560" cy="312" r="11"/><circle cx="620" cy="312" r="11"/><circle cx="690" cy="312" r="11"/>
    </g>
    <g fill="#4A2C7A">
      <rect x="98" y="322" width="24" height="10" rx="4"/><rect x="158" y="322" width="24" height="10" rx="4"/>
      <rect x="218" y="322" width="24" height="10" rx="4"/><rect x="288" y="322" width="24" height="10" rx="4"/>
      <rect x="488" y="322" width="24" height="10" rx="4"/><rect x="548" y="322" width="24" height="10" rx="4"/>
      <rect x="608" y="322" width="24" height="10" rx="4"/><rect x="678" y="322" width="24" height="10" rx="4"/>
    </g>
  </g>
  <!-- cash tin -->
  <rect x="380" y="380" width="60" height="26" rx="4" fill="#17A87A"/>
  <rect x="398" y="374" width="24" height="8" fill="#0F5C4C"/>
</svg>
