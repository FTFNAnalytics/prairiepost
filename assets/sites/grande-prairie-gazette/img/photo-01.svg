<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Aurora curtains over the dark-sky pullout, watchers along the fence line">
  <defs>
    <linearGradient id="au-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0730"/>
      <stop offset="0.62" stop-color="#1A0E33"/>
      <stop offset="1" stop-color="#2D1B4E"/>
    </linearGradient>
    <linearGradient id="cur1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FD3A6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5FD3A6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#17A87A" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="cur2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9A8FC0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6B3FD4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#4A2C7A" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#au-sky)"/>
  <!-- stars -->
  <g fill="#EAE6F5" opacity="0.8">
    <circle cx="60" cy="50" r="1.6"/><circle cx="180" cy="30" r="1.2"/><circle cx="300" cy="70" r="1.4"/>
    <circle cx="500" cy="36" r="1.2"/><circle cx="660" cy="60" r="1.6"/><circle cx="740" cy="30" r="1.2"/>
    <circle cx="410" cy="24" r="1.1"/><circle cx="110" cy="120" r="1.2"/><circle cx="720" cy="130" r="1.3"/>
  </g>
  <!-- aurora curtains -->
  <path d="M 90 40 q 30 130 -10 240 l 70 6 q 34 -128 16 -246 Z" fill="url(#cur1)"/>
  <path d="M 210 20 q 24 140 -6 260 l 58 6 q 26 -140 10 -266 Z" fill="url(#cur2)"/>
  <path d="M 330 44 q 20 120 -4 216 l 64 8 q 22 -118 6 -224 Z" fill="url(#cur1)"/>
  <path d="M 470 16 q 26 150 -8 268 l 72 6 q 30 -142 12 -274 Z" fill="url(#cur2)"/>
  <path d="M 620 46 q 22 120 -6 218 l 62 8 q 24 -120 8 -226 Z" fill="url(#cur1)"/>
  <!-- horizon band -->
  <rect y="330" width="800" height="14" fill="#17A87A" opacity="0.35"/>
  <!-- treeline -->
  <g fill="#0D0730">
    <polygon points="0,344 20,318 40,344"/><polygon points="34,344 56,308 78,344"/>
    <polygon points="700,344 722,310 744,344"/><polygon points="738,344 760,318 782,344"/>
    <polygon points="72,344 92,320 112,344"/><polygon points="670,344 688,322 706,344"/>
  </g>
  <!-- ground -->
  <rect y="344" width="800" height="106" fill="#08041F"/>
  <!-- fence line -->
  <g stroke="#2D1B4E" stroke-width="4">
    <line x1="0" y1="398" x2="800" y2="398"/>
    <line x1="90" y1="376" x2="90" y2="412"/><line x1="230" y1="376" x2="230" y2="412"/>
    <line x1="370" y1="376" x2="370" y2="412"/><line x1="510" y1="376" x2="510" y2="412"/>
    <line x1="650" y1="376" x2="650" y2="412"/>
  </g>
  <!-- watchers -->
  <g fill="#1A0E33">
    <circle cx="160" cy="372" r="9"/><rect x="151" y="380" width="18" height="34" rx="6"/>
    <circle cx="196" cy="376" r="7"/><rect x="189" y="382" width="14" height="30" rx="5"/>
    <circle cx="430" cy="370" r="9"/><rect x="421" y="378" width="18" height="36" rx="6"/>
    <circle cx="580" cy="374" r="8"/><rect x="572" y="381" width="16" height="32" rx="5"/>
    <circle cx="614" cy="378" r="6"/><rect x="608" y="384" width="12" height="26" rx="4"/>
  </g>
  <!-- one phone up, mint screen -->
  <rect x="424" y="360" width="10" height="6" fill="#5FD3A6"/>
</svg>
