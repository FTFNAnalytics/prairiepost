<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The Bear Creek trail extension through the spruce, lit underpass ahead">
  <defs>
    <linearGradient id="tr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D1B4E"/>
      <stop offset="0.6" stop-color="#4A2C7A"/>
      <stop offset="1" stop-color="#9A8FC0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tr-sky)"/>
  <!-- far bank -->
  <rect y="230" width="800" height="40" fill="#1E3A6E" opacity="0.5"/>
  <!-- spruce -->
  <g fill="#0F5C4C">
    <polygon points="60,270 92,160 124,270"/><polygon points="98,270 126,190 154,270"/>
    <polygon points="640,270 672,150 704,270"/><polygon points="690,270 718,190 746,270"/>
    <polygon points="10,270 34,200 58,270"/><polygon points="740,270 764,210 788,270"/>
  </g>
  <g fill="#1A6B5A">
    <polygon points="150,270 176,204 202,270"/><polygon points="600,270 626,200 652,270"/>
  </g>
  <!-- underpass -->
  <rect x="330" y="180" width="140" height="90" fill="#1A0E33"/>
  <path d="M 352 270 A 48 48 0 0 1 448 270 Z" fill="#120823"/>
  <path d="M 362 270 A 38 38 0 0 1 438 270 Z" fill="#F3EFC2" opacity="0.25"/>
  <rect x="330" y="172" width="140" height="10" fill="#2D1B4E"/>
  <circle cx="400" cy="196" r="6" fill="#F3EFC2"/>
  <!-- creek -->
  <path d="M 0 300 q 140 -18 260 -4 q 150 16 300 -6 q 130 -16 240 4 l 0 30 q -140 14 -260 2 q -160 -14 -300 4 q -130 16 -240 -2 Z" fill="#1E3A6E"/>
  <path d="M 60 310 q 90 -8 160 -2" stroke="#5FD3A6" stroke-width="3" fill="none" opacity="0.5"/>
  <path d="M 540 306 q 90 -8 160 0" stroke="#5FD3A6" stroke-width="3" fill="none" opacity="0.5"/>
  <!-- banks -->
  <rect y="330" width="800" height="120" fill="#0F3B33"/>
  <!-- trail -->
  <path d="M 340 450 Q 380 380 400 300 L 430 300 Q 430 380 480 450 Z" fill="#C9C3D8"/>
  <path d="M 372 450 Q 398 384 412 310" stroke="#9A9A9A" stroke-width="3" fill="none" opacity="0.5" stroke-dasharray="12 10"/>
  <!-- cyclist -->
  <g>
    <circle cx="408" cy="356" r="7" fill="#1A0E33"/>
    <rect x="400" y="362" width="16" height="18" rx="5" fill="#1A0E33"/>
    <circle cx="399" cy="386" r="9" fill="none" stroke="#1A0E33" stroke-width="3"/>
    <circle cx="421" cy="386" r="9" fill="none" stroke="#1A0E33" stroke-width="3"/>
  </g>
  <!-- trailside shrubs -->
  <g fill="#1A6B5A">
    <circle cx="120" cy="392" r="20"/><circle cx="170" cy="410" r="14"/>
    <circle cx="620" cy="396" r="18"/><circle cx="680" cy="416" r="14"/>
  </g>
</svg>
