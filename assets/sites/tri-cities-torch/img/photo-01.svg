    <rect x="296" y="316" width="78" height="16" fill="#8E7A5E"/>
    <g fill="#3A3550">
      <rect x="212" y="430" width="34" height="52"/><rect x="272" y="430" width="34" height="52"/>
      <rect x="332" y="430" width="34" height="52"/><rect x="392" y="430" width="34" height="52"/>
      <rect x="452" y="430" width="34" height="52"/><rect x="512" y="430" width="34" height="52"/>
      <rect x="212" y="514" width="34" height="52"/><rect x="272" y="514" width="34" height="52"/>
      <rect x="332" y="514" width="34" height="52"/><rect x="392" y="514" width="34" height="52"/>
      <rect x="452" y="514" width="34" height="52"/><rect x="512" y="514" width="34" height="52"/>
