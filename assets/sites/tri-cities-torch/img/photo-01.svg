  <!-- lawn -->
  <path d="M0 540 L1600 500 L1600 1067 L0 1067 Z" fill="#4E7B41"/>
  <path d="M0 690 L1600 640 L1600 1067 L0 1067 Z" fill="#3F6836"/>

