<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" role="img" aria-label="The Pickering Post">
  <title>The Pickering Post</title>
  <!--
    The tile lockup: a cyan tile carrying the initial in the headline face,
    the name flush beside it. Two-pixel radius — the system's own, never a
    pill. The face is embedded as an 11KB subset (14 glyphs) so the wordmark
    renders in Source Serif 4 even inside an <img>, where an external
    @font-face would not load.
  -->
  <style>@font-face{font-family:'SS4';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <rect x="0" y="8" width="48" height="48" rx="2" fill="#0088B0"/>
  <text x="24" y="47" text-anchor="middle" fill="#F3F2F2" font-family="SS4, Georgia, serif" font-weight="600" font-size="32">P</text>
  <text x="64" y="30" fill="#F3F2F2" font-family="SS4, Georgia, serif" font-weight="600" font-size="15" letter-spacing="1.2">THE</text>
  <text x="64" y="53" fill="#F3F2F2" font-family="SS4, Georgia, serif" font-weight="600" font-size="27" letter-spacing="-0.6">Pickering Post</text>
</svg>
