<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="The light-rail terminus where the line ends, for now">
  <rect width="1200" height="640" fill="#F3F2F2"/>
  <rect width="1200" height="330" fill="#E8F1EC"/>
  <!-- catenary -->
  <g stroke="#6E6A64" stroke-width="6" fill="none">
    <path d="M140 330V100M1060 330V100"/>
    <path d="M140 130h920"/>
  </g>
  <path d="M140 150c230 40 690 40 920 0" stroke="#201E1D" stroke-width="4" fill="none"/>
  <!-- platform -->
  <rect x="0" y="430" width="760" height="34" fill="#DBD9D4"/>
  <rect x="0" y="424" width="760" height="10" fill="#EDBB00"/>
  <!-- LRV -->
  <g>
    <rect x="80" y="240" width="560" height="184" rx="26" fill="#0B6E4F"/>
    <rect x="80" y="240" width="560" height="46" rx="23" fill="#095A41"/>
    <g fill="#8FC7B4"><rect x="120" y="300" width="96" height="72" rx="8"/><rect x="240" y="300" width="96" height="72" rx="8"/><rect x="360" y="300" width="96" height="72" rx="8"/><rect x="480" y="300" width="96" height="72" rx="8"/></g>
    <rect x="612" y="292" width="28" height="120" rx="10" fill="#8FC7B4"/>
    <rect x="96" y="386" width="530" height="12" fill="#EDBB00"/>
    <circle cx="180" cy="428" r="20" fill="#201E1D"/>
    <circle cx="330" cy="428" r="20" fill="#201E1D"/>
    <circle cx="480" cy="428" r="20" fill="#201E1D"/>
    <circle cx="590" cy="428" r="20" fill="#201E1D"/>
  </g>
  <!-- rails run out and stop -->
  <g stroke="#201E1D" stroke-width="8" fill="none">
    <path d="M0 470h880"/><path d="M0 500h880"/>
  </g>
  <g fill="#6E6A64"><rect x="60" y="478" width="20" height="14"/><rect x="180" y="478" width="20" height="14"/><rect x="300" y="478" width="20" height="14"/><rect x="420" y="478" width="20" height="14"/><rect x="540" y="478" width="20" height="14"/><rect x="660" y="478" width="20" height="14"/><rect x="780" y="478" width="20" height="14"/></g>
  <!-- end-of-track buffer -->
  <g transform="translate(892 452)">
    <rect x="0" y="0" width="18" height="66" fill="#B03A2B"/>
    <rect x="26" y="0" width="18" height="66" fill="#B03A2B"/>
    <rect x="-8" y="18" width="60" height="20" rx="6" fill="#201E1D"/>
  </g>
  <!-- the unlaid stretch: dashed future -->
  <path d="M960 486h240" stroke="#B03A2B" stroke-width="8" stroke-dasharray="20 22" fill="none"/>
  <!-- study documents stacked where track should be -->
  <g transform="translate(1000 396)">
    <rect x="8" y="34" width="120" height="20" rx="4" fill="#DBD9D4"/>
    <rect x="4" y="16" width="120" height="20" rx="4" fill="#F3F2F2" stroke="#6E6A64" stroke-width="3"/>
    <rect x="0" y="-2" width="120" height="20" rx="4" fill="#F3F2F2" stroke="#201E1D" stroke-width="3"/>
    <rect x="12" y="4" width="70" height="7" fill="#B03A2B"/>
  </g>
  <!-- riders waiting -->
  <g>
    <g transform="translate(700 368)"><circle cx="0" cy="0" r="16" fill="#201E1D"/><rect x="-18" y="14" width="36" height="44" rx="12" fill="#B03A2B"/></g>
    <g transform="translate(748 372)"><circle cx="0" cy="0" r="15" fill="#201E1D"/><rect x="-17" y="13" width="34" height="42" rx="12" fill="#095A41"/></g>
  </g>
  <rect x="0" y="560" width="1200" height="80" fill="#DBD9D4"/>
</svg>
