<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="A fourplex rising between postwar bungalows">
  <rect width="1200" height="640" fill="#F3F2F2"/>
  <rect width="1200" height="360" fill="#E8F1EC"/>
  <circle cx="180" cy="100" r="44" fill="#EDBB00" opacity=".85"/>
  <!-- street -->
  <rect x="0" y="560" width="1200" height="80" fill="#6E6A64"/>
  <rect x="0" y="552" width="1200" height="8" fill="#3A3836"/>
  <!-- left bungalow -->
  <g>
    <rect x="60" y="420" width="260" height="132" fill="#DBD9D4"/>
    <path d="M40 420 190 330l150 90Z" fill="#B03A2B"/>
    <rect x="110" y="462" width="52" height="90" fill="#201E1D"/>
    <rect x="210" y="462" width="66" height="52" fill="#8FC7B4"/>
    <rect x="206" y="458" width="74" height="60" fill="none" stroke="#201E1D" stroke-width="6"/>
  </g>
  <!-- right bungalow -->
  <g>
    <rect x="880" y="420" width="260" height="132" fill="#DBD9D4"/>
    <path d="M860 420 1010 330l150 90Z" fill="#B03A2B"/>
    <rect x="1040" y="462" width="52" height="90" fill="#201E1D"/>
    <rect x="925" y="462" width="66" height="52" fill="#8FC7B4"/>
    <rect x="921" y="458" width="74" height="60" fill="none" stroke="#201E1D" stroke-width="6"/>
  </g>
  <!-- the fourplex, mid-build -->
  <g>
    <rect x="430" y="250" width="340" height="302" fill="#0B6E4F"/>
    <rect x="430" y="250" width="340" height="18" fill="#095A41"/>
    <!-- upper floor still framing -->
    <g stroke="#EDBB00" stroke-width="8" fill="none">
      <path d="M448 250v-70M530 250v-70M612 250v-70M694 250v-70M752 250v-70"/>
      <path d="M430 180h340"/>
    </g>
    <!-- windows: four households -->
    <g fill="#8FC7B4">
      <rect x="462" y="300" width="70" height="58"/>
      <rect x="668" y="300" width="70" height="58"/>
      <rect x="462" y="410" width="70" height="58"/>
      <rect x="668" y="410" width="70" height="58"/>
    </g>
    <g fill="none" stroke="#F3F2F2" stroke-width="5">
      <rect x="462" y="300" width="70" height="58"/>
      <rect x="668" y="300" width="70" height="58"/>
      <rect x="462" y="410" width="70" height="58"/>
      <rect x="668" y="410" width="70" height="58"/>
    </g>
    <!-- two doors -->
    <rect x="562" y="462" width="36" height="90" fill="#201E1D"/>
    <rect x="604" y="462" width="36" height="90" fill="#B03A2B"/>
  </g>
  <!-- scaffold -->
  <g stroke="#6E6A64" stroke-width="6" fill="none">
    <path d="M400 552V300M418 552V300M400 340h18M400 420h18M400 500h18"/>
  </g>
  <!-- street trees -->
  <g>
    <rect x="356" y="486" width="14" height="66" fill="#5B4632"/>
    <circle cx="363" cy="452" r="46" fill="#095A41"/>
    <rect x="836" y="486" width="14" height="66" fill="#5B4632"/>
    <circle cx="843" cy="452" r="46" fill="#0B6E4F"/>
  </g>
  <!-- permit sign on the lawn -->
  <g transform="translate(492 500)">
    <rect x="26" y="0" width="8" height="52" fill="#6E6A64"/>
    <rect x="0" y="-34" width="60" height="40" fill="#F3F2F2" stroke="#201E1D" stroke-width="4"/>
    <rect x="8" y="-24" width="44" height="6" fill="#201E1D"/>
    <rect x="8" y="-12" width="30" height="6" fill="#B03A2B"/>
  </g>
</svg>
