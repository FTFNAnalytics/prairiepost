<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-label="The 410 at Queen Street, construction barrels down">
  <rect width="1200" height="640" fill="#F3F2F2"/>
  <!-- smog-advisory sky band -->
  <rect width="1200" height="220" fill="#E8E6E3"/>
  <circle cx="960" cy="110" r="46" fill="#EDBB00" opacity=".8"/>
  <!-- overpass -->
  <rect x="0" y="180" width="1200" height="46" fill="#6E6A64"/>
  <g fill="#6E6A64"><rect x="150" y="226" width="34" height="120"/><rect x="560" y="226" width="34" height="120"/><rect x="980" y="226" width="34" height="120"/></g>
  <rect x="0" y="172" width="1200" height="10" fill="#201E1D"/>
  <!-- highway fanning toward viewer -->
  <path d="M420 226 120 640h960L780 226Z" fill="#3A3836"/>
  <!-- lane lines -->
  <g stroke="#F3F2F2" stroke-width="8" stroke-dasharray="34 30" fill="none" opacity=".85">
    <path d="M530 230 400 640"/>
    <path d="M670 230 800 640"/>
  </g>
  <path d="M600 230 600 640" stroke="#EDBB00" stroke-width="8" fill="none"/>
  <!-- closed lane: barrels -->
  <g>
    <g transform="translate(455 320)"><rect x="-14" y="-34" width="28" height="34" rx="5" fill="#B03A2B"/><rect x="-14" y="-24" width="28" height="7" fill="#F3F2F2"/><rect x="-19" y="0" width="38" height="7" rx="3" fill="#201E1D"/></g>
    <g transform="translate(400 420)"><rect x="-17" y="-42" width="34" height="42" rx="6" fill="#B03A2B"/><rect x="-17" y="-30" width="34" height="9" fill="#F3F2F2"/><rect x="-23" y="0" width="46" height="8" rx="3" fill="#201E1D"/></g>
    <g transform="translate(330 540)"><rect x="-21" y="-52" width="42" height="52" rx="7" fill="#B03A2B"/><rect x="-21" y="-37" width="42" height="11" fill="#F3F2F2"/><rect x="-28" y="0" width="56" height="10" rx="4" fill="#201E1D"/></g>
  </g>
  <!-- traffic in the open lanes -->
  <g>
    <g transform="translate(640 360)"><rect x="-30" y="-20" width="60" height="34" rx="10" fill="#0B6E4F"/><rect x="-16" y="-32" width="32" height="18" rx="7" fill="#095A41"/></g>
    <g transform="translate(700 470)"><rect x="-38" y="-25" width="76" height="42" rx="12" fill="#201E1D"/><rect x="-20" y="-40" width="40" height="22" rx="8" fill="#3A3836"/></g>
    <g transform="translate(590 560)"><rect x="-44" y="-29" width="88" height="49" rx="14" fill="#B03A2B"/><rect x="-23" y="-46" width="46" height="25" rx="9" fill="#8A2D21"/></g>
  </g>
  <!-- crane beyond the shoulder -->
  <g stroke="#095A41" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M170 226V96"/><path d="M170 96h190"/><path d="M170 140l110-44"/>
  </g>
  <path d="M340 96v54" stroke="#095A41" stroke-width="4"/>
  <rect x="326" y="150" width="28" height="22" fill="#EDBB00"/>
  <!-- roadside sign -->
  <g transform="translate(1050 380)">
    <rect x="-8" y="0" width="16" height="140" fill="#6E6A64"/>
    <rect x="-70" y="-84" width="140" height="90" rx="8" fill="#EDBB00"/>
    <rect x="-52" y="-64" width="104" height="10" rx="4" fill="#201E1D"/>
    <rect x="-52" y="-44" width="104" height="10" rx="4" fill="#201E1D"/>
    <rect x="-52" y="-24" width="66" height="10" rx="4" fill="#201E1D"/>
  </g>
</svg>
