<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The midway at dusk, last summer on the old footprint">
  <defs>
    <linearGradient id="pn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E4A6B"/>
      <stop offset="0.6" stop-color="#8A6E8A"/>
      <stop offset="1" stop-color="#E8C9A0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pn-sky)"/>
  <!-- wooden coaster silhouette -->
  <g stroke="#201E1D" stroke-width="4" fill="none">
    <path d="M 20 300 Q 120 130 220 300"/>
    <path d="M 180 300 Q 280 180 380 300"/>
    <line x1="60" y1="300" x2="60" y2="238"/><line x1="100" y1="300" x2="100" y2="196"/>
    <line x1="140" y1="300" x2="140" y2="196"/><line x1="180" y1="300" x2="180" y2="238"/>
    <line x1="240" y1="300" x2="240" y2="240"/><line x1="280" y1="300" x2="280" y2="216"/>
    <line x1="320" y1="300" x2="320" y2="240"/>
    <line x1="20" y1="266" x2="220" y2="266"/><line x1="180" y1="262" x2="380" y2="262"/>
  </g>
  <!-- ferris wheel, lit -->
  <g transform="translate(600,190)">
    <circle r="96" fill="none" stroke="#F2C230" stroke-width="4"/>
    <circle r="96" fill="none" stroke="#C2591A" stroke-width="2" opacity="0.5"/>
    <g stroke="#F2C230" stroke-width="2.5">
      <line x1="-96" y1="0" x2="96" y2="0"/><line x1="0" y1="-96" x2="0" y2="96"/>
      <line x1="-68" y1="-68" x2="68" y2="68"/><line x1="-68" y1="68" x2="68" y2="-68"/>
    </g>
    <g fill="#C0392B">
      <circle cx="0" cy="-96" r="9"/><circle cx="68" cy="-68" r="9"/><circle cx="96" cy="0" r="9"/>
      <circle cx="68" cy="68" r="9"/><circle cx="0" cy="96" r="9"/><circle cx="-68" cy="68" r="9"/>
      <circle cx="-96" cy="0" r="9"/><circle cx="-68" cy="-68" r="9"/>
    </g>
    <circle r="12" fill="#F2C230"/>
    <polygon points="-30,110 0,10 30,110" fill="none" stroke="#F2C230" stroke-width="4"/>
  </g>
  <!-- midway ground -->
  <rect y="300" width="800" height="150" fill="#4A3E52"/>
  <!-- string lights -->
  <path d="M 40 330 Q 400 366 760 330" stroke="#201E1D" stroke-width="3" fill="none"/>
  <g fill="#F2C230">
    <circle cx="120" cy="338" r="5"/><circle cx="220" cy="346" r="5"/><circle cx="320" cy="352" r="5"/>
    <circle cx="420" cy="354" r="5"/><circle cx="520" cy="350" r="5"/><circle cx="620" cy="342" r="5"/>
    <circle cx="700" cy="336" r="5"/>
  </g>
  <!-- booths -->
  <g>
    <rect x="90" y="370" width="90" height="50" fill="#8A3B2E"/>
    <polygon points="82,370 135,352 188,370" fill="#C0392B"/>
    <rect x="320" y="376" width="80" height="44" fill="#2E6B8A"/>
    <polygon points="312,376 360,358 408,376" fill="#0F6E9E"/>
    <rect x="540" y="372" width="86" height="48" fill="#4E6B2E"/>
    <polygon points="532,372 583,354 634,372" fill="#1E5631"/>
  </g>
  <!-- crowd heads -->
  <g fill="#201E1D">
    <circle cx="240" cy="430" r="10"/><circle cx="280" cy="438" r="12"/><circle cx="460" cy="432" r="10"/>
    <circle cx="500" cy="440" r="12"/><circle cx="680" cy="434" r="10"/><circle cx="60" cy="438" r="11"/>
  </g>
  <!-- the 1958 arch -->
  <g stroke="#E8DFC8" stroke-width="6" fill="none">
    <path d="M 420 420 Q 450 356 480 420"/>
  </g>
  <circle cx="450" cy="362" r="6" fill="#F2C230"/>
</svg>
