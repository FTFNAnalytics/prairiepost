<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Smoke haze over the North Shore, the mountains a grey suggestion">
  <defs>
    <linearGradient id="sm-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9B896"/>
      <stop offset="0.5" stop-color="#D8C4A4"/>
      <stop offset="1" stop-color="#E0D0B4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sm-sky)"/>
  <circle cx="400" cy="130" r="34" fill="#C0392B" opacity="0.75"/>
  <!-- mountains, barely there -->
  <polygon points="0,240 160,140 320,240" fill="#A89878" opacity="0.5"/>
  <polygon points="260,240 420,120 580,240" fill="#A89878" opacity="0.4"/>
  <polygon points="520,240 660,150 800,240" fill="#A89878" opacity="0.45"/>
  <!-- haze bands -->
  <rect y="200" width="800" height="24" fill="#D8C4A4" opacity="0.8"/>
  <rect y="230" width="800" height="18" fill="#E0D0B4" opacity="0.8"/>
  <!-- inlet water, dulled -->
  <rect y="248" width="800" height="90" fill="#8A9484"/>
  <g stroke="#A8B0A0" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 80 280 q 90 -6 180 0"/><path d="M 420 300 q 100 -6 200 0"/>
  </g>
  <!-- freighter silhouettes in haze -->
  <g fill="#6E6A64" opacity="0.7">
    <path d="M 140 296 L 152 278 L 260 278 L 272 296 Z"/>
    <rect x="228" y="264" width="20" height="14"/>
    <path d="M 520 306 L 530 290 L 620 290 L 630 306 Z"/>
    <rect x="596" y="278" width="18" height="12"/>
  </g>
  <!-- city rooftops foreground -->
  <rect y="338" width="800" height="112" fill="#6E6A64"/>
  <g fill="#5A564F">
    <rect x="40" y="308" width="90" height="30"/>
    <rect x="170" y="296" width="70" height="42"/>
    <rect x="290" y="312" width="100" height="26"/>
    <rect x="430" y="300" width="80" height="38"/>
    <rect x="560" y="314" width="90" height="24"/>
    <rect x="690" y="302" width="70" height="36"/>
  </g>
  <g fill="#C9A227" opacity="0.8">
    <rect x="60" y="316" width="8" height="8"/><rect x="196" y="306" width="8" height="8"/>
    <rect x="452" y="310" width="8" height="8"/><rect x="710" y="312" width="8" height="8"/>
  </g>
  <!-- crow on a wire -->
  <line x1="0" y1="368" x2="800" y2="356" stroke="#201E1D" stroke-width="2.5"/>
  <g fill="#201E1D">
    <ellipse cx="330" cy="352" rx="12" ry="8"/>
    <circle cx="342" cy="346" r="5"/>
    <polygon points="347,346 356,344 347,349"/>
  </g>
</svg>
