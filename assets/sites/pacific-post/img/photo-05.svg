  </defs>
  <rect width="800" height="450" fill="url(#vl-sky)"/>
  <!-- building -->
  <g fill="#8A8378">
    <rect x="150" y="240" width="500" height="80"/>
    <rect x="325" y="196" width="150" height="124"/>
    <rect x="180" y="220" width="70" height="100"/>
    <rect x="550" y="220" width="70" height="100"/>
  </g>
  <g fill="#7A7368">
