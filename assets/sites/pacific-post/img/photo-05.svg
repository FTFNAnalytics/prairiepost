    <rect x="394" y="208" width="12" height="112"/><rect x="420" y="208" width="12" height="112"/>
    <rect x="446" y="208" width="12" height="112"/>
    <rect x="196" y="256" width="10" height="64"/><rect x="226" y="256" width="10" height="64"/>
    <rect x="566" y="256" width="10" height="64"/><rect x="596" y="256" width="10" height="64"/>
  </g>
  <!-- domes: weathered copper -->
  <path d="M 331 196 A 64 64 0 0 1 459 196 Z" fill="#3F8A6E"/>
  <path d="M 348 196 A 47 47 0 0 1 442 196 Z" fill="#2F7A5E"/>
  <rect x="389" y="112" width="12" height="28" fill="#3F8A6E"/>
