<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Six-storey wood-frame construction along Hastings, Burnaby">
  <defs>
    <linearGradient id="hb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9EC0D6"/>
      <stop offset="1" stop-color="#DCE8EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#hb-sky)"/>
  <!-- mountains -->
  <polygon points="0,150 130,70 260,150" fill="#7A98A8"/>
  <polygon points="200,150 340,60 480,150" fill="#8AA8B8"/>
  <polygon points="108,84 130,70 154,86 132,96" fill="#F3F2F2"/>
  <polygon points="316,76 340,60 366,78 342,90" fill="#F3F2F2"/>
  <!-- background street wall -->
  <rect y="150" width="800" height="170" fill="#C9C3B8"/>
  <g fill="#B0A896">
    <rect x="0" y="220" width="120" height="100"/>
    <rect x="640" y="230" width="160" height="90"/>
  </g>
  <!-- wood-frame building under construction -->
  <g>
    <rect x="150" y="130" width="330" height="190" fill="#D8B274"/>
    <g stroke="#A87F42" stroke-width="4">
      <line x1="150" y1="162" x2="480" y2="162"/><line x1="150" y1="194" x2="480" y2="194"/>
      <line x1="150" y1="226" x2="480" y2="226"/><line x1="150" y1="258" x2="480" y2="258"/>
      <line x1="150" y1="290" x2="480" y2="290"/>
      <line x1="205" y1="130" x2="205" y2="320"/><line x1="260" y1="130" x2="260" y2="320"/>
      <line x1="315" y1="130" x2="315" y2="320"/><line x1="370" y1="130" x2="370" y2="320"/>
      <line x1="425" y1="130" x2="425" y2="320"/>
    </g>
    <!-- wrap on lower floors -->
    <rect x="150" y="258" width="330" height="62" fill="#FFFFFF" opacity="0.85"/>
    <rect x="150" y="258" width="330" height="62" fill="#0F6E9E" opacity="0.25"/>
  </g>
  <!-- crane -->
  <g stroke="#C2591A" stroke-width="7">
    <line x1="560" y1="320" x2="560" y2="60"/>
    <line x1="440" y1="72" x2="700" y2="72"/>
    <line x1="560" y1="60" x2="440" y2="72"/>
    <line x1="560" y1="60" x2="700" y2="72"/>
  </g>
  <line x1="480" y1="72" x2="480" y2="120" stroke="#C2591A" stroke-width="4"/>
  <rect x="466" y="120" width="28" height="18" fill="#D8B274"/>
  <!-- street -->
  <rect y="320" width="800" height="130" fill="#6E6A64"/>
  <rect y="320" width="800" height="10" fill="#5A564F"/>
  <g fill="#F3F2F2" opacity="0.8">
    <rect x="60" y="378" width="60" height="7"/>
    <rect x="200" y="378" width="60" height="7"/>
    <rect x="340" y="378" width="60" height="7"/>
    <rect x="480" y="378" width="60" height="7"/>
    <rect x="620" y="378" width="60" height="7"/>
  </g>
  <!-- trolley bus -->
  <g>
    <rect x="580" y="330" width="150" height="52" rx="8" fill="#0F6E9E"/>
    <g fill="#DCE8EE">
      <rect x="592" y="340" width="24" height="16"/><rect x="622" y="340" width="24" height="16"/>
      <rect x="652" y="340" width="24" height="16"/><rect x="682" y="340" width="24" height="16"/>
    </g>
    <circle cx="612" cy="386" r="10" fill="#201E1D"/>
    <circle cx="700" cy="386" r="10" fill="#201E1D"/>
    <line x1="640" y1="330" x2="628" y2="308" stroke="#201E1D" stroke-width="3"/>
    <line x1="670" y1="330" x2="682" y2="308" stroke="#201E1D" stroke-width="3"/>
  </g>
</svg>
