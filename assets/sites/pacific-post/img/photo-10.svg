<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Portable classrooms lined up behind a Surrey school">
  <defs>
    <linearGradient id="sr-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9EC0D6"/>
      <stop offset="1" stop-color="#DCE8EE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sr-sky)"/>
  <!-- school building -->
  <rect x="60" y="120" width="320" height="130" fill="#B0432E"/>
  <rect x="60" y="108" width="320" height="16" fill="#8A3B2E"/>
  <g fill="#DCE8EE">
    <rect x="84" y="150" width="40" height="30"/><rect x="140" y="150" width="40" height="30"/>
    <rect x="196" y="150" width="40" height="30"/><rect x="252" y="150" width="40" height="30"/>
    <rect x="308" y="150" width="40" height="30"/>
    <rect x="84" y="196" width="40" height="30"/><rect x="140" y="196" width="40" height="30"/>
    <rect x="252" y="196" width="40" height="30"/><rect x="308" y="196" width="40" height="30"/>
  </g>
  <rect x="196" y="196" width="40" height="54" fill="#201E1D"/>
  <rect x="196" y="196" width="40" height="8" fill="#0F6E9E"/>
  <!-- flag -->
  <line x1="420" y1="250" x2="420" y2="140" stroke="#8A8378" stroke-width="4"/>
  <rect x="424" y="140" width="34" height="20" fill="#C0392B"/>
  <!-- portables, rows -->
  <g>
    <g>
      <rect x="470" y="196" width="120" height="54" fill="#D8D2C6"/>
      <rect x="470" y="188" width="120" height="12" fill="#8A8378"/>
      <rect x="486" y="210" width="26" height="18" fill="#9EC0D6"/>
      <rect x="546" y="210" width="26" height="18" fill="#9EC0D6"/>
    </g>
    <g>
      <rect x="620" y="196" width="120" height="54" fill="#E0DAD0"/>
      <rect x="620" y="188" width="120" height="12" fill="#8A8378"/>
      <rect x="636" y="210" width="26" height="18" fill="#9EC0D6"/>
      <rect x="696" y="210" width="26" height="18" fill="#9EC0D6"/>
    </g>
    <g>
      <rect x="470" y="286" width="120" height="54" fill="#E0DAD0"/>
      <rect x="470" y="278" width="120" height="12" fill="#8A8378"/>
      <rect x="486" y="300" width="26" height="18" fill="#9EC0D6"/>
      <rect x="546" y="300" width="26" height="18" fill="#9EC0D6"/>
    </g>
    <g>
      <rect x="620" y="286" width="120" height="54" fill="#D8D2C6"/>
      <rect x="620" y="278" width="120" height="12" fill="#8A8378"/>
      <rect x="636" y="300" width="26" height="18" fill="#9EC0D6"/>
      <rect x="696" y="300" width="26" height="18" fill="#9EC0D6"/>
    </g>
  </g>
  <!-- yard -->
  <rect y="250" width="450" height="200" fill="#4E8A5E"/>
  <rect x="450" y="340" width="350" height="110" fill="#4E8A5E"/>
  <rect y="352" width="800" height="98" fill="#458054"/>
  <!-- hopscotch + kids -->
  <g stroke="#F3F2F2" stroke-width="3" fill="none" opacity="0.8">
    <rect x="120" y="380" width="24" height="24"/><rect x="144" y="380" width="24" height="24"/>
    <rect x="132" y="356" width="24" height="24"/>
  </g>
  <g>
    <circle cx="260" cy="392" r="8" fill="#C9A227"/>
    <rect x="253" y="399" width="14" height="22" rx="5" fill="#0F6E9E"/>
    <circle cx="300" cy="398" r="7" fill="#8A5A3B"/>
    <rect x="294" y="404" width="12" height="20" rx="5" fill="#C0392B"/>
    <circle cx="620" cy="400" r="8" fill="#5A4632"/>
    <rect x="613" y="407" width="14" height="22" rx="5" fill="#1E5631"/>
  </g>
</svg>
