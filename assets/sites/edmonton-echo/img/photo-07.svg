<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="The house lights up at the hundred-seat playhouse">
  <rect width="800" height="450" fill="#04142a"/>
  <!-- proscenium -->
  <rect x="80" y="60" width="640" height="20" fill="#c14a10"/>
  <rect x="80" y="60" width="20" height="330" fill="#c14a10"/>
  <rect x="700" y="60" width="20" height="330" fill="#c14a10"/>
  <!-- curtains -->
  <g fill="#0a2240">
    <path d="M 100 80 q 30 160 10 280 l 70 0 q -24 -140 0 -280 Z"/>
    <path d="M 700 80 q -30 160 -10 280 l -70 0 q 24 -140 0 -280 Z"/>
  </g>
  <!-- stage glow -->
  <rect x="180" y="80" width="440" height="280" fill="#102c52"/>
  <polygon points="330,80 470,80 560,360 240,360" fill="#f26522" opacity="0.25"/>
  <!-- performers -->
  <g fill="#eaeef4">
    <circle cx="370" cy="250" r="12"/>
    <rect x="358" y="262" width="24" height="52" rx="8"/>
    <circle cx="440" cy="240" r="12"/>
    <rect x="428" y="252" width="24" height="62" rx="8"/>
  </g>
  <ellipse cx="405" cy="330" rx="120" ry="16" fill="#f26522" opacity="0.35"/>
  <!-- string lights -->
  <g>
    <path d="M 100 110 Q 400 160 700 110" stroke="#1e3f6b" stroke-width="3" fill="none"/>
    <g fill="#f26522">
      <circle cx="160" cy="120" r="5"/><circle cx="250" cy="130" r="5"/><circle cx="340" cy="136" r="5"/>
      <circle cx="430" cy="137" r="5"/><circle cx="520" cy="132" r="5"/><circle cx="610" cy="122" r="5"/>
    </g>
  </g>
  <!-- stage edge -->
  <rect x="80" y="360" width="640" height="12" fill="#0a2240"/>
  <!-- audience heads -->
  <g fill="#0a2240">
    <circle cx="140" cy="420" r="18"/><circle cx="230" cy="428" r="20"/><circle cx="320" cy="418" r="17"/>
    <circle cx="410" cy="430" r="21"/><circle cx="500" cy="420" r="18"/><circle cx="590" cy="428" r="20"/>
    <circle cx="670" cy="418" r="16"/><circle cx="60" cy="430" r="16"/><circle cx="740" cy="430" r="17"/>
  </g>
</svg>
