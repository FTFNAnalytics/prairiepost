<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="City hall pyramid and clock tower at first light">
  <defs>
    <linearGradient id="dawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04142a"/>
      <stop offset="0.6" stop-color="#102c52"/>
      <stop offset="1" stop-color="#1e3f6b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb2c9"/>
      <stop offset="1" stop-color="#1e3f6b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#dawn)"/>
  <circle cx="130" cy="120" r="34" fill="#f26522" opacity="0.9"/>
  <!-- background towers -->
  <g fill="#0a2240">
    <rect x="560" y="90" width="60" height="240"/>
    <rect x="640" y="140" width="48" height="190"/>
    <rect x="700" y="110" width="70" height="220"/>
    <rect x="20" y="170" width="56" height="160"/>
  </g>
  <!-- clock tower -->
  <rect x="480" y="60" width="34" height="270" fill="#102c52"/>
  <rect x="480" y="60" width="34" height="8" fill="#f26522"/>
  <circle cx="497" cy="106" r="17" fill="#eaeef4"/>
  <line x1="497" y1="106" x2="497" y2="95" stroke="#0a2240" stroke-width="3"/>
  <line x1="497" y1="106" x2="506" y2="110" stroke="#0a2240" stroke-width="3"/>
  <!-- pyramid -->
  <polygon points="230,330 390,150 550,330" fill="url(#glass)"/>
  <g stroke="#0a2240" stroke-width="3" opacity="0.6">
    <line x1="390" y1="150" x2="390" y2="330"/>
    <line x1="310" y1="240" x2="470" y2="240"/>
    <line x1="270" y1="286" x2="510" y2="286"/>
    <line x1="350" y1="195" x2="430" y2="195"/>
  </g>
  <polygon points="230,330 390,150 550,330" fill="#f26522" opacity="0.12"/>
  <!-- podium -->
  <rect x="180" y="330" width="440" height="26" fill="#0a2240"/>
  <!-- plaza -->
  <rect y="356" width="800" height="94" fill="#04142a"/>
  <rect x="140" y="368" width="520" height="4" fill="#1e3f6b"/>
  <rect x="330" y="384" width="140" height="5" fill="#f26522" opacity="0.6"/>
  <!-- flag poles -->
  <g>
    <line x1="200" y1="356" x2="200" y2="290" stroke="#1e3f6b" stroke-width="4"/>
    <rect x="204" y="290" width="26" height="15" fill="#f26522"/>
    <line x1="620" y1="356" x2="620" y2="290" stroke="#1e3f6b" stroke-width="4"/>
    <rect x="596" y="290" width="24" height="15" fill="#9fb2c9"/>
  </g>
</svg>
