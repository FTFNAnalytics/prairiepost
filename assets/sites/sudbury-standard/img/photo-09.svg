<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Freight cars and the yard on the edge of the basin at first light">
  <defs>
    <linearGradient id="s9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A5A78"/>
      <stop offset="0.6" stop-color="#9E9EA6"/>
      <stop offset="1" stop-color="#D8C4A6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#s9)"/>
  <circle cx="1240" cy="470" r="52" fill="#E8C489" opacity=".85"/>
  <path d="M0 470 L260 424 L560 468 L860 418 L1160 464 L1440 426 L1600 468 L1600 540 L0 540 Z" fill="#5A6470"/>

  <!-- the yard -->
  <rect y="540" width="1600" height="360" fill="#6E675E"/>
  <g fill="#8A8177" opacity=".7">
    <rect y="600" width="1600" height="10"/><rect y="700" width="1600" height="10"/><rect y="812" width="1600" height="10"/>
  </g>
  <g fill="#4E4840">
    <rect x="0" y="588" width="1600" height="6"/><rect x="0" y="688" width="1600" height="6"/>
  </g>

  <!-- freight cars, left of centre -->
  <g>
    <rect x="80" y="480" width="300" height="110" rx="6" fill="#7A4238"/>
    <rect x="400" y="480" width="300" height="110" rx="6" fill="#3E5A46"/>
    <rect x="720" y="480" width="300" height="110" rx="6" fill="#5A4E62"/>
    <g fill="#2E2A26">
      <circle cx="150" cy="600" r="20"/><circle cx="310" cy="600" r="20"/>
      <circle cx="470" cy="600" r="20"/><circle cx="630" cy="600" r="20"/>
      <circle cx="790" cy="600" r="20"/><circle cx="950" cy="600" r="20"/>
    </g>
    <g fill="#2E2A26" opacity=".35">
      <rect x="80" y="518" width="300" height="10"/><rect x="400" y="518" width="300" height="10"/>
      <rect x="720" y="518" width="300" height="10"/>
    </g>
  </g>
  <!-- a signal, and the stack far off -->
  <g>
    <rect x="1120" y="420" width="9" height="170" fill="#3A3630"/>
    <circle cx="1124" cy="412" r="13" fill="#C2362B"/>
    <rect x="1420" y="300" width="18" height="240" fill="#7E786F"/>
  </g>
  <g fill="#3E4A38">
    <path d="M1180 540 L1214 462 L1248 540 Z"/><path d="M1270 540 L1300 470 L1330 540 Z"/>
  </g>
</svg>
