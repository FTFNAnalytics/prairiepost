<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="The Sudbury basin at dusk: rock ridges, the Superstack and the roofs of the downtown">
  <!-- Full colour, posted true. The template lays a navy 55% overlay over
       this so the reversed type reads — that overlay is the treatment. -->
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#43536E"/>
      <stop offset="0.55" stop-color="#8E93A0"/>
      <stop offset="1" stop-color="#D8BE9A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#hsky)"/>

  <!-- far ridge -->
  <path d="M0 470 L190 404 L360 452 L560 388 L780 448 L980 400 L1200 456 L1400 412 L1600 458 L1600 560 L0 560 Z" fill="#6E7480"/>

  <!-- the Superstack, left of centre -->
  <g>
    <path d="M300 130 L332 130 L346 560 L286 560 Z" fill="#A69C92"/>
    <path d="M300 130 L316 130 L322 560 L306 560 Z" fill="#BDB3A8" opacity=".6"/>
    <rect x="292" y="126" width="48" height="12" fill="#8A8078"/>
  </g>

  <!-- headframes -->
  <g fill="#6B5E52">
    <path d="M700 300 L740 300 L752 520 L688 520 Z"/>
    <rect x="684" y="286" width="72" height="16"/>
    <path d="M690 300 L620 520 L648 520 L716 320 Z"/>
    <path d="M1060 340 L1094 340 L1104 520 L1050 520 Z"/>
    <rect x="1046" y="328" width="62" height="14"/>
    <path d="M1052 340 L992 520 L1016 520 L1074 356 Z"/>
  </g>

  <!-- near ridge: shield rock, scoured and pink-grey -->
  <path d="M0 560 L200 508 L420 568 L640 512 L880 574 L1120 520 L1360 578 L1600 534 L1600 700 L0 700 Z" fill="#8E8079"/>
  <g fill="#7A6D66" opacity=".85">
    <path d="M120 596 q60 -22 120 6 q-64 16 -120 -6 Z"/>
    <path d="M700 618 q78 -26 150 8 q-80 18 -150 -8 Z"/>
    <path d="M1250 600 q64 -22 126 6 q-68 16 -126 -6 Z"/>
  </g>
  <g fill="#46603F" opacity=".8">
    <path d="M420 640 L446 592 L472 640 Z"/><path d="M500 648 L524 600 L548 648 Z"/>
    <path d="M1150 646 L1176 598 L1202 646 Z"/>
  </g>

  <!-- the roofs -->
  <g fill="#4B4A4E">
    <rect x="180" y="640" width="150" height="120"/>
    <rect x="350" y="668" width="120" height="92"/>
    <rect x="500" y="620" width="180" height="140"/>
    <rect x="710" y="660" width="130" height="100"/>
    <rect x="870" y="634" width="165" height="126"/>
    <rect x="1060" y="672" width="140" height="88"/>
    <rect x="1225" y="640" width="175" height="120"/>
  </g>
  <g fill="#E9C88E" opacity=".85">
    <rect x="206" y="672" width="20" height="26"/><rect x="256" y="672" width="20" height="26"/>
    <rect x="530" y="654" width="22" height="28"/><rect x="590" y="654" width="22" height="28"/>
    <rect x="900" y="666" width="22" height="28"/><rect x="960" y="666" width="22" height="28"/>
    <rect x="1256" y="672" width="22" height="28"/><rect x="1316" y="672" width="22" height="28"/>
  </g>
  <rect y="760" width="1600" height="140" fill="#33333A"/>
  <g fill="#E9C88E" opacity=".4">
    <rect x="200" y="806" width="260" height="7" rx="3"/>
    <rect x="820" y="836" width="320" height="7" rx="3"/>
  </g>
</svg>
