    <rect x="1120" y="682" width="260" height="12"/>
  </g>

  <rect y="700" width="1600" height="200" fill="#6B5F55"/>
  <g fill="#59504A">
    <path d="M0 740 q180 -34 360 4 q-190 30 -360 -4 Z"/>
    <path d="M700 780 q200 -38 400 6 q-210 34 -400 -6 Z"/>
  </g>
  <g fill="#3D5638">
    <path d="M120 900 L170 792 L220 900 Z"/><path d="M240 900 L286 806 L332 900 Z"/>
    <path d="M1320 900 L1370 796 L1420 900 Z"/><path d="M1440 900 L1486 812 L1532 900 Z"/>
