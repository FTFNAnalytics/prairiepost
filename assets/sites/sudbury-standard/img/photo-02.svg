<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="The Superstack over the smelter, flat light">
  <defs>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA2B4"/>
      <stop offset="1" stop-color="#D7DDE2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#s2)"/>
  <path d="M0 560 L240 500 L520 556 L800 496 L1080 552 L1360 504 L1600 556 L1600 640 L0 640 Z" fill="#6E7A78"/>

  <!-- the stack, left of centre, full height -->
  <g>
    <path d="M420 60 L468 60 L492 700 L396 700 Z" fill="#A7A29B"/>
    <path d="M420 60 L444 60 L444 700 L432 700 Z" fill="#C0BAB2" opacity=".7"/>
