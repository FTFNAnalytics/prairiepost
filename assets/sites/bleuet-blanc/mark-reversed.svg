<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 104" role="img" aria-label="Le Bleuet Blanc">
  <title>Le Bleuet Blanc</title>
  <!--
    Le bleuet réduit à sa géométrie : deux baies pleines et une évidée.
    La baie évidée est un vrai trou (fill-rule evenodd), pas un cercle blanc —
    le fond de la page traverse le symbole, sur papier comme sur aplat bleu.
    Aucun contour, aucun cartouche.
  -->
  <g fill="currentColor" fill-rule="evenodd">
    <circle cx="34" cy="70" r="30"/>
    <circle cx="86" cy="70" r="30"/>
    <path d="M60 4a30 30 0 1 1 0 60 30 30 0 0 1 0-60Zm0 16a14 14 0 1 0 0 28 14 14 0 0 0 0-28Z"/>
  </g>
</svg>
