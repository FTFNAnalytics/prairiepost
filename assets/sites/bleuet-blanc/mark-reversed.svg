<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Le Bleuet Blanc">
  <title>Le Bleuet Blanc</title>
  <!--
    La fleur du bleuet, de face : cinq pétales détachés autour d'un coeur.
    Détachés à dessein — les pétales qui se touchent forment une masse et le
    symbole cesse de se lire comme une fleur dès qu'on le réduit. Vérifié à
    128, 64, 32, 20 et 16 pixels, sur papier comme sur aplat bleu.

    La couleur est écrite ici, pas héritée. Un SVG chargé par <img> est un
    document à part : `currentColor` y vaut noir, quoi que dise la feuille de
    style de la page. D'où deux fichiers — celui-ci pour le papier, la version
    renversée pour l'aplat.
    Celui-ci : papier, sur aplat bleu.
  -->
  <g fill="#F3F2F2">
    <ellipse cx="60.0" cy="26.0" rx="14" ry="23" transform="rotate(0 60.0 26.0)"/>
    <ellipse cx="92.3" cy="49.5" rx="14" ry="23" transform="rotate(72 92.3 49.5)"/>
    <ellipse cx="80.0" cy="87.5" rx="14" ry="23" transform="rotate(144 80.0 87.5)"/>
    <ellipse cx="40.0" cy="87.5" rx="14" ry="23" transform="rotate(216 40.0 87.5)"/>
    <ellipse cx="27.7" cy="49.5" rx="14" ry="23" transform="rotate(288 27.7 49.5)"/>
    <circle cx="60" cy="60" r="10"/>
  </g>
</svg>
